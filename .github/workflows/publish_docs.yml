name: Publish Docs

on: workflow_dispatch

permissions:
    contents: write

jobs:
    build:

        runs-on: ubuntu-latest
        if: github.repository == 'SMILEY4/schema-kenerator'

        steps:
            -   uses: actions/checkout@v3

            -   name: Set up JDK 11
                uses: actions/setup-java@v3
                with:
                    java-version: '11'
                    distribution: 'temurin'
                    cache: 'gradle'

            -   name: Cache Python
                uses: actions/cache@v4
                env:
                    cache-name: "cache-python"
                with:
                    path: '.gradle/python'
                    key: 'python'

            -   name: Setup Python
                run: ./gradlew pipInstall

            -   name: Dokka
                run: ./gradlew dokkaHtml

            -   name: Publish
                run: ./gradlew mkdocsPublish
                env:
                    GRGIT_USER: ${{ secrets.GITHUB_TOKEN }}