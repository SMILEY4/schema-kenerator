name: Checks

on: [ push, pull_request ]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

            -   uses: actions/checkout@v3

            -   name: Set up JDK 21
                uses: actions/setup-java@v3
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    cache: 'gradle'

            -   name: Build with Gradle
                run: ./gradlew build